<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" role="img" aria-label="What blocks what. One action, creating the GCP project, unblocks five verification activities; the pricing decision gates the listing copy; the legal review gates the consent screen. None of these blocks engineering, which is the correction the second review made.">
  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B57414"/>
    </marker>
    <marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B5BD6"/>
    </marker>
  </defs>
  <style>
    .t   { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
    .ttl { font-size: 19px; font-weight: 700; }
    .hd  { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .62; }
    .box { font-size: 13px; font-weight: 600; }
    .sub { font-size: 11px; opacity: .74; }
    .arw { font-size: 11px; opacity: .8; }
    .frame { fill: none; stroke: currentColor; stroke-opacity: .3; }
  </style>

  <text class="t ttl" x="24" y="30">What is blocked, on what, and who owns it — nothing here blocks engineering</text>
  <text class="t sub" x="24" y="50">The correction the review most wanted made: these three actions start slow external clocks that run CONCURRENTLY with build work. They never were the thing holding it up.</text>

  <text class="t hd" x="24" y="88">Owner action</text>
  <text class="t hd" x="470" y="88">Unblocks</text>
  <text class="t hd" x="900" y="88">Then</text>

  <!-- LC-1 -->
  <rect x="24" y="100" width="300" height="74" rx="6" fill="#5B5BD6" fill-opacity=".13" stroke="#5B5BD6" stroke-width="2"/>
  <text class="t box" x="44" y="124">LC-1 — create the GCP project</text>
  <text class="t sub" x="44" y="142">+ OAuth consent screen, a throwaway</text>
  <text class="t sub" x="44" y="157">test project is enough to start</text>
  <text class="t sub" x="44" y="168" font-weight="700">≈ one hour of your time</text>

  <g>
    <rect x="470" y="96" width="374" height="34" rx="5" fill="#B57414" fill-opacity=".14" stroke="#B57414" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text class="t box" x="486" y="118">Live render — Doc, image, repeating table, PDF export</text>

    <rect x="470" y="138" width="374" height="34" rx="5" fill="#B57414" fill-opacity=".14" stroke="#B57414" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text class="t box" x="486" y="160">Install the add-on into a real Sheet</text>

    <rect x="470" y="180" width="374" height="34" rx="5" fill="#B57414" fill-opacity=".14" stroke="#B57414" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text class="t box" x="486" y="202">Record the demo video — also the OAuth video</text>

    <rect x="470" y="222" width="374" height="34" rx="5" fill="#B57414" fill-opacity=".14" stroke="#B57414" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text class="t box" x="486" y="244">Deploy: terraform apply, migrate, smoke, rollback</text>

    <rect x="470" y="264" width="374" height="34" rx="5" fill="#B57414" fill-opacity=".14" stroke="#B57414" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text class="t box" x="486" y="286">Real load and quota numbers, pen test target</text>
  </g>

  <path d="M324,137 L440,137 L440,113 L466,113" stroke="#5B5BD6" stroke-width="1.8" fill="none" marker-end="url(#c2)"/>
  <path d="M440,137 L466,155" stroke="#5B5BD6" stroke-width="1.8" fill="none" marker-end="url(#c2)"/>
  <path d="M440,137 L440,197 L466,197" stroke="#5B5BD6" stroke-width="1.8" fill="none" marker-end="url(#c2)"/>
  <path d="M440,197 L440,239 L466,239" stroke="#5B5BD6" stroke-width="1.8" fill="none" marker-end="url(#c2)"/>
  <path d="M440,239 L440,281 L466,281" stroke="#5B5BD6" stroke-width="1.8" fill="none" marker-end="url(#c2)"/>

  <rect x="900" y="150" width="256" height="92" rx="6" class="frame"/>
  <text class="t box" x="920" y="174">Submit for OAuth verification</text>
  <text class="t sub" x="920" y="193">The clock is long and uncontrollable —</text>
  <text class="t sub" x="920" y="208">documented cases run past 8 weeks.</text>
  <text class="t sub" x="920" y="227" font-weight="700">Start it BEFORE the product is finished.</text>
  <path d="M844,197 L896,197" stroke="#B57414" stroke-width="1.8" fill="none" marker-end="url(#c1)"/>

  <!-- D-DM5 -->
  <rect x="24" y="330" width="300" height="74" rx="6" fill="#5B5BD6" fill-opacity=".13" stroke="#5B5BD6" stroke-width="2"/>
  <text class="t box" x="44" y="354">D-DM5 — the pricing call</text>
  <text class="t sub" x="44" y="372">raise ARPU to a team buyer, or cut the</text>
  <text class="t sub" x="44" y="387">cost base; both are defensible</text>
  <text class="t sub" x="44" y="398" font-weight="700">the one genuine new decision</text>

  <rect x="470" y="336" width="374" height="62" rx="5" fill="#B57414" fill-opacity=".14" stroke="#B57414" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text class="t box" x="486" y="358">Listing copy, pricing page, ICP, five story descriptions</text>
  <text class="t sub" x="486" y="377">Changing pricing AFTER submission is expensive, which is</text>
  <text class="t sub" x="486" y="391">why this sits before the submission, not after it.</text>
  <path d="M324,367 L466,367" stroke="#5B5BD6" stroke-width="1.8" fill="none" marker-end="url(#c2)"/>

  <!-- R-D22 -->
  <rect x="24" y="428" width="300" height="70" rx="6" fill="#5B5BD6" fill-opacity=".13" stroke="#5B5BD6" stroke-width="2"/>
  <text class="t box" x="44" y="452">R-D22 — get the legal review quoted</text>
  <text class="t sub" x="44" y="470">terms and privacy are a structural draft</text>
  <text class="t sub" x="44" y="485">with unreviewed warranty clauses</text>

  <rect x="470" y="428" width="374" height="70" rx="5" fill="#B57414" fill-opacity=".14" stroke="#B57414" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text class="t box" x="486" y="452">Hosted policy pages → authorised domains</text>
  <text class="t sub" x="486" y="471">→ the OAuth consent screen → everything under LC-1.</text>
  <text class="t sub" x="486" y="487">The second slow clock. Start it in the same hour as the first.</text>
  <path d="M324,463 L466,463" stroke="#5B5BD6" stroke-width="1.8" fill="none" marker-end="url(#c2)"/>

  <!-- deferred -->
  <rect x="24" y="524" width="1132" height="92" rx="6" class="frame" stroke-dasharray="5 3"/>
  <text class="t box" x="44" y="548">Deliberately NOT built — deferred by decision D-DM2, and correctly so</text>
  <text class="t sub" x="44" y="570">SAML / SCIM federation · distributed quota governor · legal hold and configurable retention · PITR and measured DR drills · production SLO history</text>
  <text class="t sub" x="44" y="589">These are a bet on a buyer the product has never met. The review agreed: it recommended accepting D-DM2 exactly as written, and separately rejecting the idea</text>
  <text class="t sub" x="44" y="606">that the remaining gap was enterprise-tier. The gap was at the working-software bar, and that bar is now met.</text>
</svg>
