<text x="130.0" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Teams bot</text>
<text x="130.0" y="336" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">Typed commands and</text>
<text x="130.0" y="350" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">Adaptive Card taps</text>
