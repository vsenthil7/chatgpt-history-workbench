<text x="814.0" y="256" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">at named sites</text>
<text x="814.0" y="270" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">entitlement gate on writes</text>
