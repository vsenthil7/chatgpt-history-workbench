<rect x="1168" y="178" width="116" height="104" rx="6" fill="none" stroke="#2E9E5B" stroke-width="2"/>
<text x="1226.0" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Per-record</text>
<text x="1226.0" y="214" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">persistence,</text>
<text x="1226.0" y="228" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">version guard,</text>
