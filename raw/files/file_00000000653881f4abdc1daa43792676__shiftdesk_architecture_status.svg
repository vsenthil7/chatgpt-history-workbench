<text x="876" y="412" text-anchor="start" font-size="10.5" font-weight="400" fill="currentColor" opacity="0.6">every request emits</text>
<text x="40" y="650" text-anchor="start" font-size="11" font-weight="600" fill="currentColor" opacity="0.6">WHAT NO CODE CAN CLOSE — eleven items, owned by a person</text>
<rect x="40" y="670" width="226" height="74" rx="6" fill="none" stroke="#D1584F" stroke-width="2" stroke-dasharray="6 4"/>
<text x="153.0" y="690" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Dev tenant</text>
<text x="153.0" y="706" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">sideload, consent,</text>
<text x="153.0" y="720" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">mobile pass</text>
<rect x="290" y="670" width="226" height="74" rx="6" fill="none" stroke="#D1584F" stroke-width="2" stroke-dasharray="6 4"/>
<text x="403.0" y="690" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Staging</text>
<text x="403.0" y="706" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">k6 5x sweep,</text>
<text x="403.0" y="720" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">p95 evidence</text>
<rect x="540" y="670" width="226" height="74" rx="6" fill="none" stroke="#D1584F" stroke-width="2" stroke-dasharray="6 4"/>
<text x="653.0" y="690" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Partner Center</text>
<text x="653.0" y="706" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">attestation,</text>
<text x="653.0" y="720" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">transactable offer</text>
<rect x="790" y="670" width="226" height="74" rx="6" fill="none" stroke="#D1584F" stroke-width="2" stroke-dasharray="6 4"/>
<text x="903.0" y="690" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Vendors + budget</text>
<text x="903.0" y="706" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">pen test,</text>
<text x="903.0" y="720" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">SOC 2 audit</text>
<rect x="1040" y="670" width="226" height="74" rx="6" fill="none" stroke="#D1584F" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1153.0" y="690" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Customers</text>
<text x="1153.0" y="706" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">15 interviews,</text>
<text x="1153.0" y="720" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">5 signed pilots</text>
<text x="40" y="794" text-anchor="start" font-size="11" font-weight="600" fill="currentColor" opacity="0.7">LEGEND</text>
<rect x="40" y="803" width="22" height="12" rx="3" fill="none" stroke="#2E9E5B" stroke-width="2"/>
<text x="72" y="812" text-anchor="start" font-size="11" font-weight="400" fill="currentColor" opacity="0.8">Verified — behaviour pinned by a named test; 68 suites / 555 cases at 100%, plus a real-Postgres tier</text>
<rect x="40" y="821" width="22" height="12" rx="3" fill="none" stroke="#C98A00" stroke-width="2"/>
<text x="72" y="830" text-anchor="start" font-size="11" font-weight="400" fill="currentColor" opacity="0.8">Code-complete pending live — built and tested, but the proof needs a real tenant, vault or offer</text>
<rect x="40" y="839" width="22" height="12" rx="3" fill="none" stroke="#D1584F" stroke-width="2" stroke-dasharray="5 3"/>
<text x="72" y="848" text-anchor="start" font-size="11" font-weight="400" fill="currentColor" opacity="0.8">Owed to a person — a purchase, an access grant or a customer. Never counted as done (decision D-SD8)</text></svg>