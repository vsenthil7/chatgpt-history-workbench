<text x="371.0" y="190" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">rotation, one refresh per</text>
<text x="371.0" y="204" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">unknown kid  · SD201</text>
