<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 880" width="1300" height="880" role="img" aria-label="How a request moves through ShiftDesk, with each component marked verified, pending live, or owed to a person" color="#1f2933" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="1300" height="880" fill="#ffffff"/><defs>
