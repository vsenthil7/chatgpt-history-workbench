<text x="594.0" y="236" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">256 KB body cap → 413</text>
<text x="594.0" y="250" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">per-IP + per-tenant</text>
<text x="594.0" y="264" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">buckets → 429</text>
<text x="594.0" y="278" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">security headers · SD205/6</text>
