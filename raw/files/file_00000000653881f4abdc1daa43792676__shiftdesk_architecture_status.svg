<text x="140.0" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Proactive messenger</text>
<text x="140.0" y="526" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">pushes the handover card</text>
<text x="140.0" y="540" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">when nobody has</text>
<text x="140.0" y="554" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">acknowledged · SD223</text>
<rect x="276" y="490" width="200" height="100" rx="6" fill="none" stroke="#2E9E5B" stroke-width="2"/>
<text x="376.0" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Retention + lifecycle</text>
<text x="376.0" y="526" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">hourly sweep enforces the</text>
<text x="376.0" y="540" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">published retention days;</text>
<text x="376.0" y="554" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">30-day uninstall purge</text>
<rect x="512" y="490" width="200" height="100" rx="6" fill="none" stroke="#C98A00" stroke-width="2"/>
<text x="612.0" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Marketplace fulfillment</text>
<text x="612.0" y="526" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">resolve, activate, five</text>
<text x="612.0" y="540" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">idempotent webhooks,</text>
<text x="612.0" y="554" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">seat reconciliation · SD239</text>
<rect x="748" y="490" width="200" height="100" rx="6" fill="none" stroke="#C98A00" stroke-width="2"/>
<text x="848.0" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Telemetry + SLO</text>
<text x="848.0" y="526" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">funnel, p95, 11 alert rules,</text>
<text x="848.0" y="540" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">216 min monthly error</text>
<text x="848.0" y="554" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">budget · sinks unconfigured</text>
<rect x="984" y="490" width="300" height="100" rx="6" fill="none" stroke="#C98A00" stroke-width="2"/>
<text x="1134.0" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Azure Key Vault (managed identity)</text>
<text x="1134.0" y="526" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">supplies the key ring; production refuses</text>
<text x="1134.0" y="540" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">a plain environment key. Never spoken to</text>
<text x="1134.0" y="554" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">a real vault · SD232</text>
