<text x="371.0" y="340" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">serviceUrl binding + skew</text>
<text x="371.0" y="354" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">SD202</text>
