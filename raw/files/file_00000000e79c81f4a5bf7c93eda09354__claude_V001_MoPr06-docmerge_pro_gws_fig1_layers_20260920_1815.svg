<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" role="img" aria-label="DocMerge Pro layer stack. The domain logic layer is verified by execution; the adapter layer beneath it is built but has never called a live service; no request has crossed the network boundary at the bottom.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8E6A"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B57414"/>
    </marker>
  </defs>

  <style>
    .t   { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
    .ttl { font-size: 19px; font-weight: 700; }
    .lay { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .62; }
    .box { font-size: 13px; font-weight: 600; }
    .sub { font-size: 11px; opacity: .72; }
    .arw { font-size: 11px; opacity: .78; }
    .leg { font-size: 12px; }
    .note{ font-size: 11.5px; opacity: .8; }
    .frame { fill: none; stroke: currentColor; stroke-opacity: .28; }
  </style>

  <text class="t ttl" x="24" y="30">DocMerge Pro — one request, and what has actually been proved at each layer</text>
  <text class="t sub" x="24" y="50">Colour is verification state, not completeness. Every box below exists and is tested; the question the review forced is what each test actually touched.</text>

  <!-- legend -->
  <g transform="translate(24,68)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#1E8E6A" fill-opacity=".18" stroke="#1E8E6A" stroke-width="1.6"/>
    <text class="t leg" x="21" y="11.5">Verified by execution here</text>
    <rect x="200" y="0" width="14" height="14" rx="3" fill="#B57414" fill-opacity=".16" stroke="#B57414" stroke-width="1.6" stroke-dasharray="4 2.5"/>
    <text class="t leg" x="221" y="11.5">Built and unit-proved — never called live</text>
    <rect x="490" y="0" width="14" height="14" rx="3" fill="#B0413E" fill-opacity=".13" stroke="#B0413E" stroke-width="1.6" stroke-dasharray="2 2.5"/>
    <text class="t leg" x="511" y="11.5">Not built — deferred by a decision</text>
  </g>

  <!-- LAYER 1 customer surfaces -->
  <text class="t lay" x="24" y="122">Customer surface</text>
  <g>
    <rect x="24" y="132" width="200" height="56" rx="6" fill="#B57414" fill-opacity=".16" stroke="#B57414" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text class="t box" x="124" y="155" text-anchor="middle">Google Sheet + sidebar</text>
    <text class="t sub" x="124" y="172" text-anchor="middle">Code.gs · Sidebar.html · 300px</text>

    <rect x="244" y="132" width="200" height="56" rx="6" fill="#B57414" fill-opacity=".16" stroke="#B57414" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text class="t box" x="344" y="155" text-anchor="middle">Google Form</text>
    <text class="t sub" x="344" y="172" text-anchor="middle">FormForwarder.gs trigger</text>

    <rect x="700" y="132" width="456" height="56" rx="6" class="frame" stroke-dasharray="4 3"/>
    <text class="t sub" x="716" y="153">Editor add-on, built on the D-DM1 recommendation. Never pushed with clasp,</text>
    <text class="t sub" x="716" y="170">never installed in a real Sheet. Ratification of D-DM1 still owed.</text>
  </g>

  <path d="M124,188 L124,228" stroke="#B57414" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#aa)"/>
  <text class="t arw" x="132" y="212">signed HTTPS</text>
  <path d="M344,188 L344,228" stroke="#B57414" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#aa)"/>
  <text class="t arw" x="352" y="212">HMAC webhook</text>

  <!-- LAYER 2 http app -->
  <text class="t lay" x="24" y="252">HTTP application</text>
  <rect x="24" y="262" width="1132" height="74" rx="6" fill="#1E8E6A" fill-opacity=".14" stroke="#1E8E6A" stroke-width="2"/>
  <text class="t box" x="44" y="286">main.ts — composition root · server.ts · app.ts router</text>
  <text class="t sub" x="44" y="305">/healthz · /readyz · /oauth/install · /oauth/callback · /webhooks/form · /webhooks/uninstall · POST documents</text>
  <text class="t sub" x="44" y="322">Proved by spawning the built artefact: port opens, 200, refuses a broken env naming the variable, drains on SIGTERM.</text>
  <text class="t sub" x="906" y="286" fill="#1E8E6A" font-weight="700">was absent</text>
  <text class="t sub" x="906" y="303">until 20 Sep it</text>
  <text class="t sub" x="906" y="320">exited 0, no port</text>

  <path d="M590,336 L590,372" stroke="#1E8E6A" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <text class="t arw" x="600" y="358">calls</text>

  <!-- LAYER 3 domain -->
  <text class="t lay" x="24" y="396">Domain logic — complete since 13 September, and never the problem</text>
  <rect x="24" y="406" width="1132" height="82" rx="6" fill="#1E8E6A" fill-opacity=".14" stroke="#1E8E6A" stroke-width="2"/>
  <g class="t box">
    <text x="60" y="432">templates</text><text x="200" y="432">batch</text><text x="320" y="432">approvals</text><text x="470" y="432">filing rules</text>
    <text x="620" y="432">form triggers</text><text x="780" y="432">billing</text><text x="900" y="432">entitlements</text><text x="1050" y="432">purge</text>
  </g>
  <g class="t box">
    <text x="60" y="458">tenant gate</text><text x="200" y="458">audit ledger</text><text x="360" y="458">quota governor</text><text x="540" y="458">sessions</text>
    <text x="680" y="458">rate limit</text><text x="800" y="458">observability</text><text x="960" y="458">release gate</text>
  </g>
  <text class="t sub" x="60" y="478">~11,500 lines at 100% coverage. The review confirmed every claim about this layer. It was measuring half the system.</text>

  <path d="M590,488 L590,524" stroke="#B57414" stroke-width="2" stroke-dasharray="5 3" fill="none" marker-end="url(#aa)"/>
  <text class="t arw" x="600" y="510">injected interface</text>

  <!-- LAYER 4 adapters -->
  <text class="t lay" x="24" y="548">Adapter layer — the layer that did not exist (P-DM-001)</text>
  <g>
    <rect x="24" y="558" width="176" height="62" rx="6" fill="#B57414" fill-opacity=".16" stroke="#B57414" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text class="t box" x="112" y="580" text-anchor="middle">GoogleDocsRenderer</text>
    <text class="t sub" x="112" y="597" text-anchor="middle">copy · batchUpdate</text>
    <text class="t sub" x="112" y="612" text-anchor="middle">export pdf/docx</text>

    <rect x="212" y="558" width="152" height="62" rx="6" fill="#B57414" fill-opacity=".16" stroke="#B57414" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text class="t box" x="288" y="580" text-anchor="middle">GoogleDriveHost</text>
    <text class="t sub" x="288" y="597" text-anchor="middle">folders · upload</text>
    <text class="t sub" x="288" y="612" text-anchor="middle">rename conflicts</text>

    <rect x="376" y="558" width="152" height="62" rx="6" fill="#B57414" fill-opacity=".16" stroke="#B57414" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text class="t box" x="452" y="580" text-anchor="middle">GoogleSheetsSource</text>
    <text class="t sub" x="452" y="597" text-anchor="middle">values.get</text>
    <text class="t sub" x="452" y="612" text-anchor="middle">A1 paging</text>

    <rect x="540" y="558" width="146" height="62" rx="6" fill="#B57414" fill-opacity=".16" stroke="#B57414" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text class="t box" x="613" y="580" text-anchor="middle">OAuth transport</text>
    <text class="t sub" x="613" y="597" text-anchor="middle">token · revoke</text>
    <text class="t sub" x="613" y="612" text-anchor="middle">ST-055 refresh</text>

    <rect x="698" y="558" width="146" height="62" rx="6" fill="#B57414" fill-opacity=".16" stroke="#B57414" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text class="t box" x="771" y="580" text-anchor="middle">Stripe gateway</text>
    <text class="t sub" x="771" y="597" text-anchor="middle">PaymentIntents</text>
    <text class="t sub" x="771" y="612" text-anchor="middle">enrolment missing</text>

    <rect x="856" y="558" width="146" height="62" rx="6" fill="#B57414" fill-opacity=".16" stroke="#B57414" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text class="t box" x="929" y="580" text-anchor="middle">Marketplace</text>
    <text class="t sub" x="929" y="597" text-anchor="middle">customerLicense</text>
    <text class="t sub" x="929" y="612" text-anchor="middle">uninstall detect</text>

    <rect x="1014" y="558" width="142" height="62" rx="6" fill="#1E8E6A" fill-opacity=".14" stroke="#1E8E6A" stroke-width="2"/>
    <text class="t box" x="1085" y="580" text-anchor="middle">PgSqlClient</text>
    <text class="t sub" x="1085" y="597" text-anchor="middle">pool · TLS · tx</text>
    <text class="t sub" x="1085" y="612" text-anchor="middle">6 migrations run</text>
  </g>

  <!-- network boundary -->
  <line x1="24" y1="656" x2="1156" y2="656" stroke="#B0413E" stroke-width="2.4" stroke-dasharray="9 5"/>
  <text class="t box" x="24" y="649" fill="#B0413E">Network boundary — six of the seven adapters above have never sent a request across this line</text>

  <!-- LAYER 5 external -->
  <g>
    <rect x="24" y="676" width="500" height="56" rx="6" class="frame" stroke-dasharray="5 3"/>
    <text class="t box" x="274" y="699" text-anchor="middle">Google Docs · Drive · Sheets · OAuth · Marketplace</text>
    <text class="t sub" x="274" y="717" text-anchor="middle">Blocked on LC-1 — no GCP project exists yet</text>

    <rect x="540" y="676" width="230" height="56" rx="6" class="frame" stroke-dasharray="5 3"/>
    <text class="t box" x="655" y="699" text-anchor="middle">Stripe</text>
    <text class="t sub" x="655" y="717" text-anchor="middle">No account; no enrolment flow</text>

    <rect x="1014" y="676" width="142" height="56" rx="6" fill="#1E8E6A" fill-opacity=".14" stroke="#1E8E6A" stroke-width="2"/>
    <text class="t box" x="1085" y="699" text-anchor="middle">PostgreSQL 16</text>
    <text class="t sub" x="1085" y="717" text-anchor="middle">real server, exercised</text>
  </g>
  <path d="M1085,620 L1085,672" stroke="#1E8E6A" stroke-width="2" fill="none" marker-end="url(#ag)"/>
</svg>
