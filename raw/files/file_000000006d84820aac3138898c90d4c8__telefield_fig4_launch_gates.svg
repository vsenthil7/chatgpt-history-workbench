<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" role="img" aria-label="Twelve acceptance gates. Supply chain passes in code. Tenant identity, durability, privacy and DNC, observability, security and differentiation are partial. Core call workflow fails, Zoho live compatibility is unproven, marketplace listing and customer validation are open, regulatory fitness is partial. No gate is fully passed because each needs live evidence."><title>Figure 4 — Twelve acceptance gates</title>
  <rect x="0" y="0" width="1180" height="470" fill="#ffffff"/>
  <text x="40" y="30" font-size="13" font-weight="700" fill="#1f2933">Acceptance gate</text>
  <text x="560" y="30" font-size="13" font-weight="700" fill="#1f2933">Status after v033</text>
  <text x="980" y="30" font-size="13" font-weight="700" fill="#1f2933">Unblocked by</text>
  <line x1="40" y1="40" x2="1140" y2="40" stroke="#1f2933" stroke-width="1.5"/>

  <g font-size="12">
    <!-- rows: y from 68, step 33 -->
    <text x="40" y="66" fill="#1f2933">Core call workflow</text>
    <rect x="300" y="54" width="240" height="17" rx="4" fill="#fbeae9" stroke="#b3261e"/>
    <text x="420" y="67" text-anchor="middle" font-size="11" font-weight="700" fill="#b3261e">FAIL — cannot place a leg</text>
    <text x="560" y="66" fill="#5a6572">state machine + gate built; no provider connected</text>
    <text x="980" y="66" font-weight="700" fill="#b3261e">PX08</text>

    <text x="40" y="99" fill="#1f2933">Tenant identity</text>
    <rect x="300" y="87" width="180" height="17" rx="4" fill="#fdf1dc" stroke="#9a6b12"/>
    <text x="390" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#9a6b12">PARTIAL — code fixed</text>
    <text x="560" y="99" fill="#5a6572">PX01 closed the cross-user defect; live proof outstanding</text>
    <text x="980" y="99" font-weight="700" fill="#9a6b12">PX07</text>

    <text x="40" y="132" fill="#1f2933">Zoho live compatibility</text>
    <rect x="300" y="120" width="150" height="17" rx="4" fill="#f2f4f8" stroke="#8a94a6"/>
    <text x="375" y="133" text-anchor="middle" font-size="11" font-weight="700" fill="#5a6572">UNPROVEN</text>
    <text x="560" y="132" fill="#5a6572">two named platform assumptions never verified</text>
    <text x="980" y="132" font-weight="700" fill="#9a6b12">PX07</text>

    <text x="40" y="165" fill="#1f2933">Durability</text>
    <rect x="300" y="153" width="210" height="17" rx="4" fill="#fdf1dc" stroke="#9a6b12"/>
    <text x="405" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#9a6b12">PARTIAL — transactional</text>
    <text x="560" y="165" fill="#5a6572">one transaction per request; still single-writer</text>
    <text x="980" y="165" font-weight="700" fill="#2b5cab">PX05 (2nd half)</text>

    <text x="40" y="198" fill="#1f2933">Privacy / DNC</text>
    <rect x="300" y="186" width="200" height="17" rx="4" fill="#fdf1dc" stroke="#9a6b12"/>
    <text x="400" y="199" text-anchor="middle" font-size="11" font-weight="700" fill="#9a6b12">PARTIAL — suppression live</text>
    <text x="560" y="198" fill="#5a6572">per-number suppression, consent ledger, erasure parity</text>
    <text x="980" y="198" font-weight="700" fill="#9a6b12">register vendor</text>

    <text x="40" y="231" fill="#1f2933">Observability</text>
    <rect x="300" y="219" width="218" height="17" rx="4" fill="#fdf1dc" stroke="#9a6b12"/>
    <text x="409" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#9a6b12">PARTIAL — measured, not sent</text>
    <text x="560" y="231" fill="#5a6572">every alert is computed and then discarded</text>
    <text x="980" y="231" font-weight="700" fill="#9a6b12">PX09</text>

    <text x="40" y="264" fill="#1f2933">Security</text>
    <rect x="300" y="252" width="200" height="17" rx="4" fill="#fdf1dc" stroke="#9a6b12"/>
    <text x="400" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#9a6b12">PARTIAL — no outside attack</text>
    <text x="560" y="264" fill="#5a6572">strong static controls; nobody external has attacked it</text>
    <text x="980" y="264" font-weight="700" fill="#9a6b12">PX12</text>

    <text x="40" y="297" fill="#1f2933">Marketplace listing</text>
    <rect x="300" y="285" width="130" height="17" rx="4" fill="#f2f4f8" stroke="#8a94a6"/>
    <text x="365" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#5a6572">OPEN</text>
    <text x="560" y="297" fill="#5a6572">nothing submitted; needs the dev org and the assets</text>
    <text x="980" y="297" font-weight="700" fill="#9a6b12">PX07</text>

    <text x="40" y="330" fill="#1f2933">Customer validation</text>
    <rect x="300" y="318" width="152" height="17" rx="4" fill="#f2f4f8" stroke="#8a94a6"/>
    <text x="376" y="331" text-anchor="middle" font-size="11" font-weight="700" fill="#5a6572">OPEN — zero users</text>
    <text x="560" y="330" fill="#5a6572">highest-value unblocked item in the whole plan</text>
    <text x="980" y="330" font-weight="700" fill="#b3261e">PX13</text>

    <text x="40" y="363" fill="#1f2933">Differentiation</text>
    <rect x="300" y="351" width="180" height="17" rx="4" fill="#fdf1dc" stroke="#9a6b12"/>
    <text x="390" y="364" text-anchor="middle" font-size="11" font-weight="700" fill="#9a6b12">AT RISK</text>
    <text x="560" y="363" fill="#5a6572">Zoho now ships telephony, a power dialler and RouteIQ</text>
    <text x="980" y="363" font-weight="700" fill="#b3261e">PX13</text>

    <text x="40" y="396" fill="#1f2933">Supply chain / clean build</text>
    <rect x="300" y="384" width="150" height="17" rx="4" fill="#e6f4ee" stroke="#157f5b"/>
    <text x="375" y="397" text-anchor="middle" font-size="11" font-weight="700" fill="#157f5b">PASS in code</text>
    <text x="560" y="396" fill="#5a6572">a clean clone with no cache builds, tests and renders — proven from the zip</text>
    <text x="980" y="396" font-weight="700" fill="#157f5b">done (PX02)</text>

    <text x="40" y="429" fill="#1f2933">Regulatory fitness (India)</text>
    <rect x="300" y="417" width="232" height="17" rx="4" fill="#fdf1dc" stroke="#9a6b12"/>
    <text x="416" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#9a6b12">PARTIAL — every local check built</text>
    <text x="560" y="429" fill="#5a6572">the live register is the only missing piece</text>
    <text x="980" y="429" font-weight="700" fill="#9a6b12">register vendor</text>
  </g>
  <line x1="40" y1="446" x2="1140" y2="446" stroke="#d7dce3"/>
  <text x="40" y="462" font-size="11.5" fill="#5a6572">Ten of twelve gates need evidence that cannot be produced inside this environment. That is the finding, not a complaint about the code.</text>
</svg>
