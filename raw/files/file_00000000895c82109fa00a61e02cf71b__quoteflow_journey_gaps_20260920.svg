<svg xmlns='http://www.w3.org/2000/svg' width='1460' height='900' viewBox='0 0 1460 900' role='img' aria-label='QuoteFlow — the quote journey, and the three gaps that decide whether it matters'>
<defs>
  <marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'>
    <path d='M 0 0 L 10 5 L 0 10 z' fill='#64748B'/>
  </marker>
</defs>
<rect width='1460' height='900' fill='#FFFFFF'/>
<text x='36' y='44' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='23' font-weight='700' fill='#0F172A'>QuoteFlow — the quote journey, and the three gaps that decide whether it matters</text>
<text x='36' y='68' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' fill='#475569'>The top row is what a rep would do. The row beneath it is what has never been proved.</text>
<line x1='36' y1='82' x2='1424' y2='82' stroke='#E2E8F0' stroke-width='1.5'/>
<rect x='60' y='130' width='168' height='118' rx='7' fill='#FDF0D5' stroke='#B07D00' stroke-width='2.2'/>
<circle cx='214' cy='144' r='8.5' fill='#B07D00'/>
<text x='214' y='147.8' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>C</text>
<text x='72' y='150.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='600' fill='#6B4B00'>1. Open the deal</text>
<text x='72' y='169.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#6B4B00' opacity='0.85'>The app card loads inside</text>
<text x='72' y='181.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#6B4B00' opacity='0.85'>HubSpot and mints a session.</text>
<rect x='60' y='268' width='168' height='92' rx='7' fill='#FBE3E1' stroke='#C0392B' stroke-width='2.2'/>
<circle cx='214' cy='282' r='8.5' fill='#C0392B'/>
<text x='214' y='285.8' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>X</text>
<text x='72' y='288.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600' fill='#7A211A'>Gap</text>
<text x='72' y='306.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.2' fill='#7A211A' opacity='0.85'>Never seen by a human inside</text>
<text x='72' y='318.3' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.2' fill='#7A211A' opacity='0.85'>HubSpot — R-Q15.</text>
<path d='M 144.0 248 L 144.0 268' stroke='#64748B' stroke-width='1.8' fill='none' marker-end='url(#arrow)'/>
<path d='M 231 189 L 247 189' stroke='#64748B' stroke-width='1.8' fill='none' marker-end='url(#arrow)'/>
<rect x='250' y='130' width='168' height='118' rx='7' fill='#DFF3E7' stroke='#1B7F4B' stroke-width='2.2'/>
<circle cx='404' cy='144' r='8.5' fill='#1B7F4B'/>
<text x='404' y='147.8' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>P</text>
<text x='262' y='150.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='600' fill='#0F4C2E'>2. Configure</text>
<text x='262' y='169.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#0F4C2E' opacity='0.85'>Pick options; incompatible</text>
<text x='262' y='181.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#0F4C2E' opacity='0.85'>ones are blocked with the</text>
<text x='262' y='193.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#0F4C2E' opacity='0.85'>rule that blocked them.</text>
<path d='M 421 189 L 437 189' stroke='#64748B' stroke-width='1.8' fill='none' marker-end='url(#arrow)'/>
<rect x='440' y='130' width='168' height='118' rx='7' fill='#DFF3E7' stroke='#1B7F4B' stroke-width='2.2'/>
<circle cx='594' cy='144' r='8.5' fill='#1B7F4B'/>
<text x='594' y='147.8' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>P</text>
<text x='452' y='150.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='600' fill='#0F4C2E'>3. Price</text>
<text x='452' y='169.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#0F4C2E' opacity='0.85'>Bundles, entity book,</text>
<text x='452' y='181.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#0F4C2E' opacity='0.85'>currency, ramp, usage,</text>
<text x='452' y='193.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#0F4C2E' opacity='0.85'>floor, channel — one</text>
<text x='452' y='205.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#0F4C2E' opacity='0.85'>waterfall per line.</text>
<path d='M 611 189 L 627 189' stroke='#64748B' stroke-width='1.8' fill='none' marker-end='url(#arrow)'/>
<rect x='630' y='130' width='168' height='118' rx='7' fill='#DFF3E7' stroke='#1B7F4B' stroke-width='2.2'/>
<circle cx='784' cy='144' r='8.5' fill='#1B7F4B'/>
<text x='784' y='147.8' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>P</text>
<text x='642' y='150.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='600' fill='#0F4C2E'>4. Approve</text>
<text x='642' y='169.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#0F4C2E' opacity='0.85'>The desk DAG opens the</text>
<text x='642' y='181.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#0F4C2E' opacity='0.85'>branches this deal actually</text>
<text x='642' y='193.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#0F4C2E' opacity='0.85'>trips. No bypass.</text>
<path d='M 801 189 L 817 189' stroke='#64748B' stroke-width='1.8' fill='none' marker-end='url(#arrow)'/>
<rect x='820' y='130' width='168' height='118' rx='7' fill='#DFF3E7' stroke='#1B7F4B' stroke-width='2.2'/>
<circle cx='974' cy='144' r='8.5' fill='#1B7F4B'/>
<text x='974' y='147.8' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>P</text>
<text x='832' y='150.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='600' fill='#0F4C2E'>5. Sign</text>
<text x='832' y='169.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#0F4C2E' opacity='0.85'>Deterministic document,</text>
<text x='832' y='181.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#0F4C2E' opacity='0.85'>content seal, certificate of</text>
<text x='832' y='193.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#0F4C2E' opacity='0.85'>completion.</text>
<rect x='820' y='268' width='168' height='92' rx='7' fill='#FBE3E1' stroke='#C0392B' stroke-width='2.2'/>
<circle cx='974' cy='282' r='8.5' fill='#C0392B'/>
<text x='974' y='285.8' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>X</text>
<text x='832' y='288.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600' fill='#7A211A'>Gap</text>
<text x='832' y='306.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.2' fill='#7A211A' opacity='0.85'>No signature provider</text>
<text x='832' y='318.3' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.2' fill='#7A211A' opacity='0.85'>account; the homegrown</text>
<text x='832' y='330.1' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.2' fill='#7A211A' opacity='0.85'>signer is the only path.</text>
<path d='M 904.0 248 L 904.0 268' stroke='#64748B' stroke-width='1.8' fill='none' marker-end='url(#arrow)'/>
<path d='M 991 189 L 1007 189' stroke='#64748B' stroke-width='1.8' fill='none' marker-end='url(#arrow)'/>
<rect x='1010' y='130' width='168' height='118' rx='7' fill='#FDF0D5' stroke='#B07D00' stroke-width='2.2'/>
<circle cx='1164' cy='144' r='8.5' fill='#B07D00'/>
<text x='1164' y='147.8' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>C</text>
<text x='1022' y='150.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='600' fill='#6B4B00'>6. Push to deal</text>
<text x='1022' y='169.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#6B4B00' opacity='0.85'>Only items QuoteFlow created</text>
<text x='1022' y='181.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#6B4B00' opacity='0.85'>are touched; the rest</text>
<text x='1022' y='193.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#6B4B00' opacity='0.85'>survive untouched.</text>
<rect x='1010' y='268' width='168' height='92' rx='7' fill='#FBE3E1' stroke='#C0392B' stroke-width='2.2'/>
<circle cx='1164' cy='282' r='8.5' fill='#C0392B'/>
<text x='1164' y='285.8' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>X</text>
<text x='1022' y='288.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600' fill='#7A211A'>Gap</text>
<text x='1022' y='306.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.2' fill='#7A211A' opacity='0.85'>Never run against a real</text>
<text x='1022' y='318.3' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.2' fill='#7A211A' opacity='0.85'>portal.</text>
<path d='M 1094.0 248 L 1094.0 268' stroke='#64748B' stroke-width='1.8' fill='none' marker-end='url(#arrow)'/>
<path d='M 1181 189 L 1197 189' stroke='#64748B' stroke-width='1.8' fill='none' marker-end='url(#arrow)'/>
<rect x='1200' y='130' width='168' height='118' rx='7' fill='#FDF0D5' stroke='#B07D00' stroke-width='2.2'/>
<circle cx='1354' cy='144' r='8.5' fill='#B07D00'/>
<text x='1354' y='147.8' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>C</text>
<text x='1212' y='150.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='600' fill='#6B4B00'>7. Get paid</text>
<text x='1212' y='169.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#6B4B00' opacity='0.85'>Subscribe, prorate, dun,</text>
<text x='1212' y='181.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#6B4B00' opacity='0.85'>recover — driven by verified</text>
<text x='1212' y='193.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.4' fill='#6B4B00' opacity='0.85'>provider webhooks.</text>
<rect x='1200' y='268' width='168' height='92' rx='7' fill='#FBE3E1' stroke='#C0392B' stroke-width='2.2'/>
<circle cx='1354' cy='282' r='8.5' fill='#C0392B'/>
<text x='1354' y='285.8' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>X</text>
<text x='1212' y='288.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600' fill='#7A211A'>Gap</text>
<text x='1212' y='306.5' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.2' fill='#7A211A' opacity='0.85'>No Stripe keys, no</text>
<text x='1212' y='318.3' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.2' fill='#7A211A' opacity='0.85'>marketplace monetisation —</text>
<text x='1212' y='330.1' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.2' fill='#7A211A' opacity='0.85'>R-Q10.</text>
<path d='M 1284.0 248 L 1284.0 268' stroke='#64748B' stroke-width='1.8' fill='none' marker-end='url(#arrow)'/>
<rect x='36' y='400' width='1388' height='210' rx='10' fill='#F8FAFC' stroke='#CBD5E1' stroke-width='1' stroke-dasharray='5 4'/>
<text x='50' y='420' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='12' font-weight='700' fill='#475569' letter-spacing='0.6'>WHAT DECIDES WHETHER ANY OF THIS MATTERS</text>
<rect x='60' y='436' width='430' height='150' rx='7' fill='#FBE3E1' stroke='#C0392B' stroke-width='2.2'/>
<circle cx='476' cy='450' r='8.5' fill='#C0392B'/>
<text x='476' y='453.8' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>X</text>
<text x='72' y='456' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#7A211A'>The platform gap</text>
<text x='72' y='476.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' fill='#7A211A' opacity='0.85'>Nothing has ever run inside HubSpot. The Projects app and the app card</text>
<text x='72' y='489.1' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' fill='#7A211A' opacity='0.85'>are written against the published 2026.03 developer-platform shape and</text>
<text x='72' y='502.2' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' fill='#7A211A' opacity='0.85'>have never been installed, rendered or accepted. Until a developer</text>
<text x='72' y='515.3' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' fill='#7A211A' opacity='0.85'>account exists, every green box above is a statement about our own</text>
<text x='72' y='528.4' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' fill='#7A211A' opacity='0.85'>tests rather than about the product.</text>
<rect x='515' y='436' width='430' height='150' rx='7' fill='#FBE3E1' stroke='#C0392B' stroke-width='2.2'/>
<circle cx='931' cy='450' r='8.5' fill='#C0392B'/>
<text x='931' y='453.8' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>X</text>
<text x='527' y='456' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#7A211A'>The commercial gap</text>
<text x='527' y='476.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' fill='#7A211A' opacity='0.85'>No listing, no design partner, no paying customer, no churn data. The</text>
<text x='527' y='489.1' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' fill='#7A211A' opacity='0.85'>configuration scenarios come from limitations HubSpot documents, not</text>
<text x='527' y='502.2' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' fill='#7A211A' opacity='0.85'>from a prospect who asked. The depth may be real and still be depth in</text>
<text x='527' y='515.3' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' fill='#7A211A' opacity='0.85'>the wrong direction.</text>
<rect x='970' y='436' width='454' height='150' rx='7' fill='#FBE3E1' stroke='#C0392B' stroke-width='2.2'/>
<circle cx='1410' cy='450' r='8.5' fill='#C0392B'/>
<text x='1410' y='453.8' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>X</text>
<text x='982' y='456' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#7A211A'>The operational gap</text>
<text x='982' y='476.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' fill='#7A211A' opacity='0.85'>p95 under load, a measured RPO and RTO, a deploy with zero dropped</text>
<text x='982' y='489.1' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' fill='#7A211A' opacity='0.85'>requests, and a clean penetration test are all absent. Two harness scripts</text>
<text x='982' y='502.2' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' fill='#7A211A' opacity='0.85'>are written and have never been run; the other two are purchases, not</text>
<text x='982' y='515.3' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' fill='#7A211A' opacity='0.85'>sprints.</text>
<rect x='36' y='630' width='1388' height='150' rx='10' fill='#F8FAFC' stroke='#CBD5E1' stroke-width='1' stroke-dasharray='5 4'/>
<text x='50' y='650' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='12' font-weight='700' fill='#475569' letter-spacing='0.6'>THE RULE THAT KEEPS THIS HONEST</text>
<rect x='60' y='664' width='1364' height='96' rx='7' fill='#DFF3E7' stroke='#1B7F4B' stroke-width='2.2'/>
<circle cx='1410' cy='678' r='8.5' fill='#1B7F4B'/>
<text x='1410' y='681.8' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>P</text>
<text x='72' y='684' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#0F4C2E'>A claim may not be stated above the evidence that backs it.</text>
<text x='72' y='705.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11' fill='#0F4C2E' opacity='0.85'>Every test file declares the class of evidence it produces (CODE, CONTRACT, LIVE, SECURITY, PERF, OPS, COMMERCIAL). Every published claim carries the classes it requires and the classes it has. CI fails the build when a</text>
<text x='72' y='718.6' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11' fill='#0F4C2E' opacity='0.85'>test file is untagged, when a class a shipped feature claims is empty, or when a gap has no named owner. 8 of 15 claims are currently supported; 7 are blocked, and each names what would unblock it. The 100% coverage gate is</text>
<text x='72' y='732.2' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11' fill='#0F4C2E' opacity='0.85'>a REGRESSION FLOOR — it stops behaviour disappearing unnoticed, and says nothing about whether the behaviour is right.</text>
<text x='1424' y='870' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' fill='#94A3B8' text-anchor='end'>QuoteFlow · Fig. 2 of 2 · v001 · 20 Sep 2026</text>
</svg>