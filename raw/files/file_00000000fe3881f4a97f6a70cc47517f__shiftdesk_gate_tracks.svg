<text x="638.0" y="394" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">copy written against free</text>
<text x="638.0" y="408" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">Approvals and Planner</text>
<line x1="510" y1="389" x2="530" y2="389" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.85"/>
