<text x="406.0" y="134" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">sideload, consent in 2 tenants,</text>
<text x="406.0" y="148" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">mobile screenshot</text>
