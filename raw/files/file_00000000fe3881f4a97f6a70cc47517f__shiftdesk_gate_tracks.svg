<text x="870.0" y="394" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">per-site pricing; funding</text>
<text x="870.0" y="408" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">requirement stated</text>
<line x1="742" y1="389" x2="762" y2="389" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.85"/>
<rect x="996" y="344" width="212" height="90" rx="6" fill="none" stroke="#D1584F" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1102.0" y="364" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">5 paid pilots</text>
<text x="1102.0" y="380" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">SD247</text>
<text x="1102.0" y="394" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">five paying tenants, retention</text>
<text x="1102.0" y="408" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">measured through the funnel</text>
<line x1="974" y1="389" x2="994" y2="389" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.85"/>
<polyline points="242,250 272,250 272,389 298,389" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.85"/>
<rect x="1226" y="344" width="58" height="90" rx="6" fill="none" stroke="#D1584F" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1255.0" y="364" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">G-02</text>
<text x="1255.0" y="380" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">10 paid</text>
<line x1="1204" y1="389" x2="1224" y2="389" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.85"/>
<text x="790" y="268" text-anchor="middle" font-size="11.5" font-weight="600" fill="currentColor" opacity="0.85">Both tracks must land. Track A without Track B ships something nobody asked for;</text>
<text x="790" y="286" text-anchor="middle" font-size="11.5" font-weight="600" fill="currentColor" opacity="0.85">Track B without Track A has nothing to sell.</text></svg>