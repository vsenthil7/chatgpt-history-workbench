<text x="1255.0" y="120" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">listed</text>
<line x1="1204" y1="129" x2="1224" y2="129" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.85"/>
<text x="300" y="322" text-anchor="start" font-size="11.5" font-weight="600" fill="currentColor" opacity="0.65">TRACK B — SHOULD IT SHIP?  neither end can be bought</text>
