<text x="638.0" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Staging</text>
<text x="638.0" y="120" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">SD219 / SD220 / SD231</text>
<text x="638.0" y="134" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">k6 5x sweep passes,</text>
<text x="638.0" y="148" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">p95 and 409 evidence</text>
