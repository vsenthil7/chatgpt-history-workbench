<text x="870.0" y="134" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">pen-test Highs closed,</text>
<text x="870.0" y="148" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">attestation, a11y signed</text>
