<text x="406.0" y="364" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">15 discovery interviews</text>
<text x="406.0" y="380" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">SD244 — unparks D13</text>
<text x="406.0" y="394" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">how handover evidence is made</text>
<text x="406.0" y="408" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">today, what audit failure costs</text>
