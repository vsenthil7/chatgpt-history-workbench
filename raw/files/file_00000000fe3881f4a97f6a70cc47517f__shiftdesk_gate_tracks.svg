<text x="140.0" y="234" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">never run in a real</text>
<text x="140.0" y="248" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">Microsoft tenant</text>
<text x="300" y="60" text-anchor="start" font-size="11.5" font-weight="600" fill="currentColor" opacity="0.65">TRACK A — CAN IT SHIP?  every box is access or money</text>
