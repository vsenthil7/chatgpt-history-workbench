<rect x="40" y="170" width="200" height="110" rx="6" fill="none" stroke="#2E9E5B" stroke-width="2"/>
<text x="140.0" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Where it is today</text>
<text x="140.0" y="206" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">code-complete,</text>
