<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="Before and after. On 16 September the adapter layer was empty and nothing invoked the entrypoint, so no request could reach the domain logic. On 20 September the entrypoint, the adapters and the purge worker exist, and the only remaining gap is that no request has crossed the network boundary.">
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B0413E"/>
    </marker>
    <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8E6A"/>
    </marker>
    <marker id="b3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B57414"/>
    </marker>
  </defs>
  <style>
    .t   { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
    .ttl { font-size: 19px; font-weight: 700; }
    .pan { font-size: 15px; font-weight: 700; }
    .box { font-size: 12.5px; font-weight: 600; }
    .sub { font-size: 11px; opacity: .74; }
    .arw { font-size: 11px; opacity: .8; }
    .frame { fill: none; stroke: currentColor; stroke-opacity: .28; }
  </style>

  <text class="t ttl" x="24" y="30">What changed between the two reviews — the same architecture, with the missing layer filled in</text>
  <text class="t sub" x="24" y="50">Both panels show an identical design. The difference is not a redesign; it is that four boxes which existed only as TypeScript interfaces now have code behind them.</text>

  <!-- divider -->
  <line x1="590" y1="74" x2="590" y2="536" stroke="currentColor" stroke-opacity=".2" stroke-width="1"/>

  <!-- ============ BEFORE ============ -->
  <text class="t pan" x="24" y="96">16 September — as the external review found it</text>
  <text class="t sub" x="24" y="114">882 tests · 100% coverage · every gate green</text>

  <rect x="24" y="128" width="250" height="46" rx="6" class="frame" stroke-dasharray="5 3"/>
  <text class="t box" x="149" y="147" text-anchor="middle">Add-on / customer surface</text>
  <text class="t sub" x="149" y="164" text-anchor="middle">no manifest, no Code.gs, nothing</text>

  <rect x="24" y="192" width="250" height="52" rx="6" fill="#B0413E" fill-opacity=".13" stroke="#B0413E" stroke-width="2" stroke-dasharray="3 3"/>
  <text class="t box" x="149" y="212" text-anchor="middle">npm start</text>
  <text class="t sub" x="149" y="230" text-anchor="middle">exported start(); nothing called it</text>
  <text class="t box" x="292" y="218" fill="#B0413E">exits 0</text>
  <text class="t sub" x="292" y="234">no port opens</text>

  <rect x="24" y="262" width="250" height="60" rx="6" fill="#1E8E6A" fill-opacity=".14" stroke="#1E8E6A" stroke-width="2"/>
  <text class="t box" x="149" y="285" text-anchor="middle">Domain logic</text>
  <text class="t sub" x="149" y="303" text-anchor="middle">complete, tested, correct</text>
  <text class="t sub" x="149" y="317" text-anchor="middle">and unreachable</text>

  <rect x="24" y="340" width="250" height="64" rx="6" fill="#B0413E" fill-opacity=".13" stroke="#B0413E" stroke-width="2" stroke-dasharray="3 3"/>
  <text class="t box" x="149" y="363" text-anchor="middle">Adapter layer</text>
  <text class="t sub" x="149" y="381" text-anchor="middle">EMPTY — interfaces only</text>
  <text class="t sub" x="149" y="396" text-anchor="middle">package.json had no dependencies</text>

  <rect x="24" y="422" width="250" height="46" rx="6" class="frame" stroke-dasharray="5 3"/>
  <text class="t box" x="149" y="441" text-anchor="middle">Google · Stripe · Postgres</text>
  <text class="t sub" x="149" y="458" text-anchor="middle">unreachable by construction</text>

  <path d="M149,322 L149,336" stroke="#B0413E" stroke-width="2" stroke-dasharray="3 3" fill="none" marker-end="url(#b1)"/>
  <path d="M149,404 L149,418" stroke="#B0413E" stroke-width="2" stroke-dasharray="3 3" fill="none" marker-end="url(#b1)"/>
  <text class="t arw" x="292" y="378" fill="#B0413E">no implementation</text>
  <text class="t arw" x="292" y="394" fill="#B0413E">behind any boundary</text>

  <text class="t sub" x="24" y="496">Coverage could not see it: a file that was never written has no lines to leave uncovered —</text>
  <text class="t sub" x="24" y="512">and the more boundaries you inject, the cleaner the number gets.</text>

  <!-- ============ AFTER ============ -->
  <text class="t pan" x="620" y="96">20 September — after S13–S19 and a verification pass</text>
  <text class="t sub" x="620" y="114">1,513 tests · 100% coverage · four new standing gates</text>

  <rect x="620" y="128" width="250" height="46" rx="6" fill="#B57414" fill-opacity=".16" stroke="#B57414" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text class="t box" x="745" y="147" text-anchor="middle">Editor add-on</text>
  <text class="t sub" x="745" y="164" text-anchor="middle">manifest, Code.gs, sidebar — built</text>

  <rect x="620" y="192" width="250" height="52" rx="6" fill="#1E8E6A" fill-opacity=".14" stroke="#1E8E6A" stroke-width="2"/>
  <text class="t box" x="745" y="212" text-anchor="middle">npm start → main.ts</text>
  <text class="t sub" x="745" y="230" text-anchor="middle">binds a port; /healthz answers 200</text>
  <text class="t box" x="888" y="218" fill="#1E8E6A">serves</text>
  <text class="t sub" x="888" y="234">proved by spawning it</text>

  <rect x="620" y="262" width="250" height="60" rx="6" fill="#1E8E6A" fill-opacity=".14" stroke="#1E8E6A" stroke-width="2"/>
  <text class="t box" x="745" y="285" text-anchor="middle">Domain logic</text>
  <text class="t sub" x="745" y="303" text-anchor="middle">unchanged — not one module</text>
  <text class="t sub" x="745" y="317" text-anchor="middle">was rewritten</text>

  <rect x="620" y="340" width="250" height="64" rx="6" fill="#B57414" fill-opacity=".16" stroke="#B57414" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text class="t box" x="745" y="363" text-anchor="middle">Adapter layer</text>
  <text class="t sub" x="745" y="381" text-anchor="middle">7 adapters, real URLs, real bodies</text>
  <text class="t sub" x="745" y="396" text-anchor="middle">proved against recorded contracts</text>

  <rect x="620" y="422" width="250" height="46" rx="6" class="frame" stroke-dasharray="5 3"/>
  <text class="t box" x="745" y="441" text-anchor="middle">Google · Stripe</text>
  <text class="t sub" x="745" y="458" text-anchor="middle">still not called — LC-1</text>

  <rect x="890" y="422" width="150" height="46" rx="6" fill="#1E8E6A" fill-opacity=".14" stroke="#1E8E6A" stroke-width="2"/>
  <text class="t box" x="965" y="441" text-anchor="middle">PostgreSQL 16</text>
  <text class="t sub" x="965" y="458" text-anchor="middle">really exercised</text>

  <path d="M745,322 L745,336" stroke="#1E8E6A" stroke-width="2" fill="none" marker-end="url(#b2)"/>
  <path d="M745,404 L745,418" stroke="#B57414" stroke-width="2" stroke-dasharray="5 3" fill="none" marker-end="url(#b3)"/>
  <path d="M870,372 L960,372 L960,418" stroke="#1E8E6A" stroke-width="2" fill="none" marker-end="url(#b2)"/>

  <text class="t sub" x="620" y="496">The dependency injection that hid the gap is what made closing it additive rather than a rewrite:</text>
  <text class="t sub" x="620" y="512">every interface an adapter needed was already written, already tested, and already correct.</text>
</svg>
