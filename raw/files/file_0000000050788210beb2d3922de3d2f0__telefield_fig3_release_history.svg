<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" role="img" aria-label="Release history in four phases: v001 to v012 built the twelve sprints, v013 to v031 were seventeen cold review passes that found thirty-five defects, v032 incorporated the ChatGPT review, v033 incorporated the Perplexity review. Eight sprints remain, six of them blocked on an external account, org, vendor or customer, and two unblocked."><title>Figure 3 — Release history and what remains</title>
  <rect x="0" y="0" width="1180" height="470" fill="#ffffff"/>

  <!-- timeline axis -->

  <!-- phase 1 -->
  <rect x="40" y="60" width="250" height="120" rx="9" fill="#e6f4ee" stroke="#157f5b" stroke-width="1.5"/>
  <text x="165" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#157f5b">v001 – v012 · BUILD</text>
  <text x="165" y="104" text-anchor="middle" font-size="11.5" fill="#1f2933">10–11 Sep · 12 sprints</text>
  <text x="165" y="122" text-anchor="middle" font-size="11.5" fill="#1f2933">98 of 100 stories in code</text>
  <text x="165" y="140" text-anchor="middle" font-size="11.5" fill="#1f2933">1,261 tests at 100%</text>
  <text x="165" y="163" text-anchor="middle" font-size="11" fill="#5a6572">labelled “FINAL” at v012</text>

  <!-- phase 2 -->
  <rect x="308" y="60" width="290" height="120" rx="9" fill="#fdf1dc" stroke="#9a6b12" stroke-width="1.5"/>
  <text x="453" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#9a6b12">v013 – v031 · COLD REVIEW</text>
  <text x="453" y="104" text-anchor="middle" font-size="11.5" fill="#1f2933">13 Sep · 17 adversarial passes</text>
  <text x="453" y="122" text-anchor="middle" font-size="11.5" fill="#1f2933">35 defects · 16 artefact gaps</text>
  <text x="453" y="140" text-anchor="middle" font-size="11.5" fill="#1f2933">Postgres · screens · extension</text>
  <text x="453" y="163" text-anchor="middle" font-size="11" fill="#5a6572">all inside code that already had 100% coverage</text>

  <!-- phase 3 -->
  <rect x="616" y="60" width="230" height="120" rx="9" fill="#fdf1dc" stroke="#9a6b12" stroke-width="1.5"/>
  <text x="731" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#9a6b12">v032 · CHATGPT REVIEW</text>
  <text x="731" y="104" text-anchor="middle" font-size="11.5" fill="#1f2933">15 Sep · “BUILD, NOT LAUNCH”</text>
  <text x="731" y="122" text-anchor="middle" font-size="11.5" fill="#1f2933">10 findings · E01–E13</text>
  <text x="731" y="140" text-anchor="middle" font-size="11.5" fill="#1f2933">widget became real (E01)</text>
  <text x="731" y="163" text-anchor="middle" font-size="11" fill="#5a6572">2 blockers closed</text>

  <!-- phase 4 -->
  <rect x="864" y="60" width="276" height="120" rx="9" fill="#e6f4ee" stroke="#157f5b" stroke-width="2"/>
  <text x="1002" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#157f5b">v033 · PERPLEXITY REVIEW</text>
  <text x="1002" y="104" text-anchor="middle" font-size="11.5" fill="#1f2933">20 Sep · 8 findings · PX01–PX14</text>
  <text x="1002" y="122" text-anchor="middle" font-size="11.5" fill="#1f2933">PX01–PX06 executed</text>
  <text x="1002" y="140" text-anchor="middle" font-size="11.5" fill="#1f2933">1,769 tests · 9 gates</text>
  <text x="1002" y="163" text-anchor="middle" font-size="11" fill="#5a6572">identity · compliance · money · state</text>

  <text x="590" y="206" text-anchor="middle" font-size="12" fill="#5a6572">Each review found defects the previous one and 100% coverage had both missed.</text>
  <text x="590" y="224" text-anchor="middle" font-size="12" fill="#5a6572">Three of the four Perplexity findings were <tspan font-weight="700">recurrences of classes already closed once</tspan> — which is why every sprint now ships the gate, not just the fix.</text>

  <!-- remaining -->
  <text x="40" y="262" font-size="14" font-weight="700" fill="#1f2933">What remains — 8 sprints, and what each one is waiting for</text>

  <g font-size="11.5">
    <!-- blocked ones -->
    <rect x="40" y="278" width="258" height="72" rx="8" fill="#fbeae9" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="54" y="298" font-size="12.5" font-weight="700" fill="#b3261e">PX08 · place a real call</text>
    <text x="54" y="316" fill="#1f2933">2 provider sandbox accounts</text>
    <text x="54" y="333" fill="#5a6572">owner: Senthil · blocks launch</text>

    <rect x="314" y="278" width="258" height="72" rx="8" fill="#fbeae9" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="328" y="298" font-size="12.5" font-weight="700" fill="#b3261e">PX07 · live install</text>
    <text x="328" y="316" fill="#1f2933">Zoho developer account + dev org</text>
    <text x="328" y="333" fill="#5a6572">owner: Senthil · blocks launch</text>

    <rect x="588" y="278" width="258" height="72" rx="8" fill="#f2f4f8" stroke="#8a94a6" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="602" y="298" font-size="12.5" font-weight="700" fill="#5a6572">PX09 · notifications</text>
    <text x="602" y="316" fill="#1f2933">email / SMS provider account</text>
    <text x="602" y="333" fill="#5a6572">owner: Senthil · blocks charging</text>

    <rect x="862" y="278" width="278" height="72" rx="8" fill="#f2f4f8" stroke="#8a94a6" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="876" y="298" font-size="12.5" font-weight="700" fill="#5a6572">PX13 · willingness to pay</text>
    <text x="876" y="316" fill="#1f2933">3–5 design partners</text>
    <text x="876" y="333" fill="#5a6572">owner: Senthil · do this first</text>

    <rect x="40" y="362" width="258" height="72" rx="8" fill="#f2f4f8" stroke="#8a94a6" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="54" y="382" font-size="12.5" font-weight="700" fill="#5a6572">PX12 · procurement</text>
    <text x="54" y="400" fill="#1f2933">external pen-test vendor</text>
    <text x="54" y="417" fill="#5a6572">owner: Senthil</text>

    <rect x="314" y="362" width="258" height="72" rx="8" fill="#f2f4f8" stroke="#8a94a6" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="328" y="382" font-size="12.5" font-weight="700" fill="#5a6572">PX14 · AI follow-up</text>
    <text x="328" y="400" fill="#1f2933">needs recordings + pilot signal</text>
    <text x="328" y="417" fill="#5a6572">correctly last</text>

    <!-- unblocked -->
    <rect x="588" y="362" width="258" height="72" rx="8" fill="#eaf0fa" stroke="#2b5cab" stroke-width="1.8"/>
    <text x="602" y="382" font-size="12.5" font-weight="700" fill="#2b5cab">PX10 · mobile + control tower</text>
    <text x="602" y="400" fill="#1f2933">nothing blocking — Claude work</text>
    <text x="602" y="417" fill="#5a6572">next on “go ahead”</text>

    <rect x="862" y="362" width="278" height="72" rx="8" fill="#eaf0fa" stroke="#2b5cab" stroke-width="1.8"/>
    <text x="876" y="382" font-size="12.5" font-weight="700" fill="#2b5cab">PX11 · vernacular + vertical</text>
    <text x="876" y="400" fill="#1f2933">nothing blocking — Claude work</text>
    <text x="876" y="417" fill="#5a6572">next on “go ahead”</text>
  </g>
</svg>
